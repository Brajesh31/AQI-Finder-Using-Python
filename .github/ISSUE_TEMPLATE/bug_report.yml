name: 🐛 Bug report
description: Report a reproducible defect in AQI Finder.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not include API tokens, credential-bearing URLs, or private location data."
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the visible behaviour and expected result.
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized error message
      description: Remove tokens and personal location details.
  - type: checkboxes
    id: safe
    attributes:
      label: Safety check
      options:
        - label: I have removed API tokens and private information.
          required: true
