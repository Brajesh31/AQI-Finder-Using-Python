name: Python quality checks

on:
  push:
    branches: [main]
    paths:
      - "AQI PYTHON"
      - "tests/**"
      - "requirements*.txt"
      - ".github/workflows/quality.yml"
  pull_request:
    branches: [main]
    paths:
      - "AQI PYTHON"
      - "tests/**"
      - "requirements*.txt"
      - ".github/workflows/quality.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aqi-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile application and tests
        run: python -m py_compile "AQI PYTHON" tests/*.py
      - name: Run unit and mocked provider tests
        run: python -m pytest -q
