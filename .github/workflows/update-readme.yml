name: Update README Automation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "README.md"
      - ".github/workflows/update-readme.yml"
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: write

concurrency:
  group: update-readme-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update README timestamp
        shell: bash
        run: |
          DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
          TIMESTAMP_LINE="Last updated: $DATE"

          if grep -q "Last updated:" README.md; then
            sed -i "s/Last updated:.*/$TIMESTAMP_LINE/" README.md
          else
            printf "\n%s\n" "$TIMESTAMP_LINE" >> README.md
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "No README changes detected."
            exit 0
          fi
          git commit -m "chore: refresh README timestamp"
          git push
